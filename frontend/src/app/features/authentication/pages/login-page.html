<section class="card login-card">
  <h2>Connexion administrateur</h2>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <fieldset [disabled]="auth.isPending()">
      <div class="field">
        <label for="login-email">Adresse e-mail</label>
        <input id="login-email" type="email" formControlName="email" autocomplete="username"/>

        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="error">Renseignez une adresse e-mail valide.</small>
        }
      </div>

      <div class="field">
        <label for="login-password">Mot de passe</label>
        <input id="login-password" type="password" formControlName="password" autocomplete="current-password"/>

        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="error">Le mot de passe est obligatoire.</small>
        }
      </div>
    </fieldset>

    @if (auth.error()) {
      <p class="error" role="alert">{{ auth.error() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || auth.isPending()">
      {{ auth.isPending() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>
</section>
